<html lang="en">

    <style>
        :root {
            --background-color: #121212;
            --container-color: rgba(26, 26, 26, 0.85);
            --text-color: #ffffff;
            --border-color: #ffffff;
            --hover-bg-color: #ffffff;
            --hover-text-color: #000000;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden; 
        }
        
        #vanta-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
        }

        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--background-color);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        
        .loader.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .dot-spinner { --uib-size: 2.8rem; --uib-speed: .9s; --uib-color: var(--text-color); position: relative; display: flex; align-items: center; justify-content: flex-start; height: var(--uib-size); width: var(--uib-size); }
        .dot-spinner__dot { position: absolute; top: 0; left: 0; display: flex; align-items: center; justify-content: flex-start; height: 100%; width: 100%; }
        .dot-spinner__dot::before { content: ''; height: 20%; width: 20%; border-radius: 50%; background-color: var(--uib-color); transform: scale(0); opacity: 0.5; animation: pulse calc(var(--uib-speed) * 1.111) ease-in-out infinite; }
        .dot-spinner__dot:nth-child(2) { transform: rotate(45deg); } .dot-spinner__dot:nth-child(2)::before { animation-delay: calc(var(--uib-speed) * -0.875); } .dot-spinner__dot:nth-child(3) { transform: rotate(90deg); } .dot-spinner__dot:nth-child(3)::before { animation-delay: calc(var(--uib-speed) * -0.75); } .dot-spinner__dot:nth-child(4) { transform: rotate(135deg); } .dot-spinner__dot:nth-child(4)::before { animation-delay: calc(var(--uib-speed) * -0.625); } .dot-spinner__dot:nth-child(5) { transform: rotate(180deg); } .dot-spinner__dot:nth-child(5)::before { animation-delay: calc(var(--uib-speed) * -0.5); } .dot-spinner__dot:nth-child(6) { transform: rotate(225deg); } .dot-spinner__dot:nth-child(6)::before { animation-delay: calc(var(--uib-speed) * -0.375); } .dot-spinner__dot:nth-child(7) { transform: rotate(270deg); } .dot-spinner__dot:nth-child(7)::before { animation-delay: calc(var(--uib-speed) * -0.25); } .dot-spinner__dot:nth-child(8) { transform: rotate(315deg); } .dot-spinner__dot:nth-child(8)::before { animation-delay: calc(var(--uib-speed) * -0.125); }
        @keyframes pulse { 0%, 100% { transform: scale(0); opacity: 0.5; } 50% { transform: scale(1); opacity: 1; }}

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            background-color: var(--container-color);
            backdrop-filter: blur(10px);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
            max-width: 500px;
            width: 90%;
            visibility: hidden;
            max-height: 90vh;
            overflow-y: auto;
        }
        
      
        .container::-webkit-scrollbar {
            width: 8px; 
        }

        .container::-webkit-scrollbar-track {
            background: transparent; 
        }

        .container::-webkit-scrollbar-thumb {
            background-color: #4a4a4a; 
            border-radius: 10px; 
            border: 2px solid transparent; 
            background-clip: content-box;
        }

        .container::-webkit-scrollbar-thumb:hover {
            background-color: #6a6a6a;
        }
        
        /* For Firefox */
        .container {
            scrollbar-width: thin; 
            scrollbar-color: #4a4a4a transparent;
        }


        .profile-pic { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; margin-bottom: 1rem; border: 3px solid var(--border-color); }
        h1 { margin: 0.5rem 0; font-weight: 600; }
        p { color: #ccc; margin-bottom: 2rem; }
        .links { list-style: none; padding: 0; margin: 0; }
        .links li { margin-bottom: 1rem; }
        .links a { display: flex; align-items: center; justify-content: center; padding: 1rem; background-color: transparent; color: var(--text-color); text-decoration: none; border-radius: 10px; border: 2px solid var(--border-color); transition: background-color 0.3s ease, color 0.3s ease, transform 0.2s ease; }
        .links a:hover { background-color: var(--hover-bg-color); color: var(--hover-text-color); transform: translateY(-3px) scale(1.02); }
        .links a i { margin-right: 0.75rem; font-size: 1.2rem; }

        @media (max-width: 600px) { .container { padding: 1.5rem; } .profile-pic { width: 100px; height: 100px; } .links a { padding: 0.8rem; } }
    </style>
</head>
<body>

    <audio id="background-audio" src="background-music.m4a" loop></audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.rings.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize Vanta.js
            VANTA.RINGS({
                el: "#vanta-bg",
                mouseControls: true,
                touchControls: true,
                gyroControls: false,
                minHeight: 200.00,
                minWidth: 200.00,
                scale: 1.00,
                scaleMobile: 1.00,
                color: 0xffffff,
                backgroundColor: 0x121212
            });

            const loader = document.querySelector('.loader');
            const container = document.querySelector('.container');
            const audio = document.getElementById('background-audio');

            setTimeout(() => {
                if (loader) {
                    loader.classList.add('hidden');
                }

                if (container) {
                    container.style.visibility = 'visible';
                    container.classList.add('animate__animated', 'animate__fadeIn');
                }
                
                if (audio) {
                    audio.volume = 0.02;
                    // Try to play the audio
                    let playPromise = audio.play();

                    if (playPromise !== undefined) {
                        playPromise.catch(error => {
                            // Autoplay was prevented.
                            console.log("Audio autoplay was blocked. Waiting for user interaction.");
                            // Create a one-time event listener to play audio on the first click.
                            const playAudioOnClick = () => {
                                audio.play();
                                document.removeEventListener('click', playAudioOnClick);
                            };
                            document.addEventListener('click', playAudioOnClick);
                        });
                    }
                }
            }, 2500);
        });
    </script>
